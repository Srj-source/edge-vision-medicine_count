<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"><animate attributeName="stop-color" values="#0f2027;#1a2a6c;#0f2027" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"><animate attributeName="stop-color" values="#2c5364;#00b09b;#2c5364" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#7fffd4"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="300" rx="20" fill="url(#bg)"/>

  <!-- floating pills -->
  <g filter="url(#glow)" opacity="0.9">
    <g>
      <circle cx="90" cy="70" r="26" fill="#ff6b6b"/><circle cx="90" cy="70" r="26" fill="none" stroke="#fff" stroke-width="2"><animate attributeName="r" values="26;38;26" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,14;0,0" dur="4s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="170" cy="215" r="20" fill="#feca57"/><circle cx="170" cy="215" r="20" fill="none" stroke="#fff" stroke-width="2"><animate attributeName="r" values="20;32;20" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite"/></circle>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="5s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="840" y="50" width="70" height="30" rx="15" fill="#48dbfb"/><rect x="875" y="50" width="35" height="30" rx="15" fill="#fff" opacity="0.9"/>
      <animateTransform attributeName="transform" type="rotate" values="-12 875 65;12 875 65;-12 875 65" dur="4s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="880" cy="225" r="24" fill="#1dd1a1"/><circle cx="880" cy="225" r="24" fill="none" stroke="#fff" stroke-width="2"><animate attributeName="r" values="24;36;24" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,12;0,0" dur="4.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- scan line -->
  <rect x="0" y="0" width="1000" height="3" fill="#7fffd4" opacity="0.7" filter="url(#glow)">
    <animate attributeName="y" values="0;297;0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="500" y="105" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#cfeff0" letter-spacing="6">
    IIT ROORKEE  •  TMI PROJECT
  </text>
  <text x="500" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#txt)" filter="url(#glow)">
    AI Medicine Counting System
    <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/>
  </text>
  <text x="500" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#e8fffb">
    Count tablets &amp; capsules with classical OpenCV
  </text>
  <text x="500" y="262" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fd9d2" letter-spacing="3">
    Upload  →  Segment  →  Detect  →  Count
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
